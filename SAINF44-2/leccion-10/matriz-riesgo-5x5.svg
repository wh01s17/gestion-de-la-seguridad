<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="matriz-riesgo-title matriz-riesgo-desc">
      <title id="matriz-riesgo-title">Matriz de riesgo 5 × 5 con bandas de visualización</title>
      <desc id="matriz-riesgo-desc">Matriz de probabilidad por impacto de 1 a 5. Cada celda muestra el producto y su banda: bajo de 1 a 4, moderado de 5 a 9, alto de 10 a 16 y crítico de 17 a 25. Se destacan dos celdas con producto 10 que cuentan historias distintas, P2 por I5 y P5 por I2, y se ubican los tres riesgos del caso ficticio VIÑA DEL ESTE: V-01 en P3 por I4, V-02 en P2 por I5 y V-03 en P2 por I5 como valor provisional.</desc>
